# StarHeart 插件 · 工具配置
#
# 为什么会有这个文件：AstrBot 官方插件开发规范要求「提交前执行 ruff format . 与 ruff check .」，
# 而仓里原先**没有任何 ruff 配置** —— 于是每个人跑出来的结果都不一样：ruff 默认行宽 88 与本项目
# 实际风格（约 120）不符，一次报出上千条 E501，等于没有闸门；配合 --isolated 也不可复现。
# 这里把口径固定下来，让 `ruff check .` 成为一个真能守住的门。

[tool.ruff]
# 与既有代码一致：实际书写宽度约 110~120
line-length = 120
target-version = "py312"
# devtools 是开发工具（不随插件发布）；pages 是纯前端（由 node --check 把关）
extend-exclude = ["devtools", "pages", ".git", "__pycache__"]

[tool.ruff.format]
# 本项目源码是 CRLF（Windows 上开发）。不声明的话 `ruff format` 会按 LF 重排，
# 产生「整个文件都变了」的假 diff。
line-ending = "cr-lf"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle 错误
  "F",   # pyflakes：未定义名 / 未使用导入
  "W",   # pycodestyle 警告
  "I",   # import 排序
  "UP",  # pyupgrade：过时写法
]
ignore = [
  # 行宽交给上面的 line-length 兜底；中文注释/提示词常量强行折断反而更难读
  "E501",
  # % 格式化：本项目在日志与流水文案里大量使用，改造收益低于回归风险
  "UP031",
]

[tool.ruff.lint.per-file-ignores]
# 面板 API 与 service 层存在刻意保留的宽 except（降级点，均带 noqa: BLE001 说明）
"core/page_api.py" = ["BLE001"]

# ─────────────────────────────────────────────────────────────────────────────
# 关于 `ruff format`：**故意不整体执行**，说明如下（不是漏做）。
#
# 现状：`ruff check .` 已 100% 通过，可作为提交闸门。
#      `ruff format --diff .` 会重排 7 个文件、约 1.9 万行 —— 因为源码是 CRLF 且
#      历史风格与 ruff 格式化器不一致，纯格式变更会让 diff 变成「整个文件都换了」。
#
# 代价：会冲掉 git blame、淹没真正的逻辑改动、并可能重开已经反复调过的
#      画布/图谱布局与样式问题（那部分改了一周以上才稳定）。
#
# 做法：逻辑改动与格式化**分两次提交**。要做格式化时，单独开一个
#      `chore: ruff format` 提交，不带任何行为改动，方便单独回滚：
#          ruff format . && ruff check . && python -m compileall -q main.py core/
# ─────────────────────────────────────────────────────────────────────────────
